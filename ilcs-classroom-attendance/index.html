<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Attendance</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
          --accent: #1f3a5f; --absent: #b42318; --absent-bg: #fef3f2; --ok: #067647;
          --warn: #f5b40b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --ink: #e8eaed; --muted: #9aa3ad; --line: #2a313a;
            --accent: #8fb3e0; --absent: #f97066; --absent-bg: #2a1614; --ok: #47cd89;
            --warn: #fdb022; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; gap: 8px; align-items: center; z-index: 1; }
  .dates { display: flex; align-items: center; gap: 2px; flex: none; }
  .dates button { width: 32px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--ink);
                  font-size: 24px; line-height: 1; cursor: pointer; }
  .dates button:disabled { opacity: .3; cursor: default; }
  header select, header input { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
           border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; }
  header select { flex: 1; }
  .avatar { position: relative; flex: none; }
  .avatar > button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent);
                     color: var(--bg); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .menu { position: absolute; right: 0; top: 44px; min-width: 180px; padding: 8px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgb(0 0 0 / .15); }
  .menu[hidden] { display: none; }
  .menu p { margin: 4px 8px 8px; color: var(--muted); font-size: 14px; }
  .menu button { width: 100%; text-align: left; padding: 8px; border: 0; border-radius: 6px;
                 background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .menu button:hover { background: var(--bg); }
  .menu { width: 240px; }
  .menu .note { margin: 4px 8px; font-size: 13px; }
  main { padding: 12px 16px 96px; max-width: 640px; margin: 0 auto; }
  .summary { color: var(--muted); margin: 4px 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; display: flex; justify-content: space-between; align-items: center;
              padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px;
              background: var(--card); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  li button .state { font-size: 14px; color: var(--muted); }
  li button.absent { background: var(--absent-bg); border-color: var(--absent); }
  li button.absent .state { color: var(--absent); font-weight: 600; }
  li button.other .state { font-style: italic; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: var(--card);
           border-top: 1px solid var(--line); }
  footer button, .setup button { width: 100%; max-width: 640px; display: block; margin: 0 auto; padding: 14px;
           font: inherit; font-weight: 600; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); }
  footer button:disabled { opacity: .5; }
  li button.unsaved { border-left: 5px solid var(--warn); padding-left: 12px; }
  .unsaved-count { color: var(--warn); font-weight: 600; }
  .msg { text-align: center; margin: 8px 0 0; font-size: 15px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--absent); }
  .setup { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
  .setup .logo { display: block; width: 100%; height: auto; padding: 12px; background: #fff; border-radius: 12px; }
  .setup input { width: 100%; font: inherit; padding: 12px; margin: 12px 0; border: 1px solid var(--line);
                 border-radius: 8px; background: var(--card); color: var(--ink); }
  .warn { padding: 12px; border: 1px solid var(--absent); border-radius: 8px; background: var(--absent-bg); font-size: 15px; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'https://app.sycamoreschool.com/api/v1/';
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
const app = document.getElementById('app');
const today = () => new Date().toLocaleDateString('en-CA');
let token = store.get('token'), me = {}, classes = [], roster = [], state = {}, existing = {};

async function api(path, body) {
  const res = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/json',
               ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  if (!res.ok) throw new Error(`${res.status} ${text.slice(0, 120)}`);
  return text.trim() ? JSON.parse(text) : null;
}

function setup(error) {
  app.innerHTML = `<div class="setup"><img class="logo" src="ilcs-logo.png" alt="Immanuel Lutheran Church and School" width="399" height="100"><h2>Classroom Attendance</h2>
    <p>Paste your Sycamore access token. Create one in Sycamore under My Organizer &gt; Utilities &gt; Applications.</p>
    <p class="warn"><strong>Keep your token secret.</strong> It works like your Sycamore password. Anyone who has it
      can see and change your class records as you. Do not share it, email it, or text it to anyone, including
      the office. If you think someone else has it, delete it in My Organizer &gt; Utilities &gt; Applications and create a new one.</p>
    <input id="tok" type="password" autocomplete="off" placeholder="Access token">
    <button id="save">Save</button>
    <p class="msg err">${error || ''}</p></div>`;
  document.getElementById('save').onclick = () => {
    token = document.getElementById('tok').value.trim();
    store.set('token', token);
    start();
  };
}

// Groups come back keyed by class type (Daylong, Period, Preschool...); keep homerooms.
const homerooms = groups => Object.values(groups || {}).flat().filter(c => String(c.HomeRoom) === '1');

async function start() {
  if (!token) return setup();
  try {
    me = await api('Me');
    classes = homerooms(await api(`User/${me.UserID}/Classes`));
    // ponytail: office accounts teach no class; fall back to every homeroom in the school
    if (!classes.length) classes = homerooms(await api(`School/${me.SchoolID}/Classes`));
  } catch (e) {
    store.set('token', '');
    token = '';
    return setup('That token did not work: ' + e.message);
  }
  if (!classes.length) return setup('No homeroom classes found for this account.');
  classes.sort((a, b) => a.Name.localeCompare(b.Name));
  render();
  load();
}

function render() {
  const saved = store.get('class');
  app.innerHTML = `<header>
      <select id="cls">${classes.map(c => `<option value="${c.ID}"${String(c.ID) === saved ? ' selected' : ''}>${esc(c.Name)}</option>`).join('')}</select>
      <div class="dates"><button id="prev" aria-label="Previous day">‹</button>
        <input id="date" type="date" value="${today()}" max="${today()}">
        <button id="next" aria-label="Next day" disabled>›</button></div>
      <div class="avatar"><button id="avatar" aria-label="Account" aria-haspopup="true">${esc(initials())}</button>
        <div class="menu" id="menu" hidden><p>${esc(`${me.FirstName || ''} ${me.LastName || ''}`.trim())}</p>
          <button id="signout">Sign out</button>
          <p class="note">Signing out removes your token from this device. You will need to paste it again to sign back in.</p></div></div>
    </header>
    <main><p class="summary" id="summary">Loading...</p><ul id="list"></ul>
    </main>
    <footer><button id="submit" disabled>Submit</button><p class="msg" id="msg"></p></footer>`;
  for (const id of ['cls', 'date']) {
    const el = document.getElementById(id);
    el.dataset.prev = el.value;
    el.onchange = () => {
      if (Object.keys(changes()).length && !confirm('Attendance for this class has not been submitted. Leave without saving?')) {
        el.value = el.dataset.prev;
        return;
      }
      el.dataset.prev = el.value;
      if (id === 'cls') store.set('class', el.value);
      document.getElementById('next').disabled = val('date') >= today();
      load();
    };
  }
  const step = days => {
    const el = document.getElementById('date'), d = new Date(el.value + 'T12:00');
    do d.setDate(d.getDate() + days); while (d.getDay() === 0 || d.getDay() === 6);
    const next = d.toLocaleDateString('en-CA');
    if (next > today()) return;
    el.value = next;
    el.dispatchEvent(new Event('change'));
  };
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  document.getElementById('submit').onclick = submit;
  document.getElementById('signout').onclick = () => { store.set('token', ''); token = ''; setup(); };
  const menu = document.getElementById('menu');
  document.getElementById('avatar').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  document.onclick = e => { if (!menu.contains(e.target)) menu.hidden = true; };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const initials = () => ((me.FirstName || '?').charAt(0) + (me.LastName || '').charAt(0)).toUpperCase();
const val = id => document.getElementById(id).value;
const msg = (text, kind) => { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); };

async function load() {
  msg('');
  document.getElementById('submit').disabled = true;
  document.getElementById('summary').textContent = 'Loading...';
  try {
    const data = await api(`Class/${val('cls')}/Attendance?date=${val('date')}`);
    roster = (data?.Students || []).sort((a, b) => a.LastName.localeCompare(b.LastName) || a.FirstName.localeCompare(b.FirstName));
    existing = {};
    for (const [id, r] of Object.entries(data?.AttendanceResults || {})) if (r.Here) existing[id] = r;
    state = {};
    for (const s of roster) {
      const r = existing[s.ID];
      state[s.ID] = !r ? 'P' : Number(r.Present) === 1 && !Number(r.Absent) ? 'P'
                  : Number(r.Absent) === 1 && !Number(r.Present) ? 'A' : 'other';
    }
    draw();
  } catch (e) {
    document.getElementById('summary').textContent = '';
    msg('Could not load the class: ' + e.message, 'err');
  }
}

function label(s) {
  if (state[s.ID] === 'A') return 'Absent';
  if (state[s.ID] === 'other') return 'Partial day (set by office)';
  return 'Present';
}

function draw() {
  const list = document.getElementById('list'), unsaved = changes();
  list.innerHTML = roster.map(s => {
    const st = state[s.ID];
    const cls = [st === 'A' ? 'absent' : st === 'other' ? 'other' : '', unsaved[s.ID] ? 'unsaved' : ''].join(' ');
    return `<li><button data-id="${s.ID}" class="${cls}">
      <span>${esc(s.LastName)}, ${esc(s.NickName || s.FirstName)}</span><span class="state">${label(s)}${unsaved[s.ID] ? ' · not saved' : ''}</span></button></li>`;
  }).join('');
  list.querySelectorAll('button').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    state[id] = state[id] === 'A' ? 'P' : 'A';
    draw();
  });
  const absent = roster.filter(s => state[s.ID] === 'A').length;
  const taken = Object.keys(existing).length;
  const pending = Object.keys(unsaved).length, btn = document.getElementById('submit');
  document.getElementById('summary').innerHTML = `${roster.length - absent} present, ${absent} absent`
    + (pending ? ` · <span class="unsaved-count">${pending} not saved</span>` : taken ? ' · saved' : '');
  btn.disabled = !pending;
  btn.textContent = pending ? 'Submit attendance' : taken ? 'Submitted ✓' : 'Submit attendance';
  if (pending) msg('');
}

// Only students with no record yet or whose status changed, so office corrections
// (partial days, tardies, notes) are never overwritten.
function changes() {
  const students = {};
  for (const s of roster) {
    const st = state[s.ID], r = existing[s.ID];
    if (st === 'other') continue;
    const was = !r ? null : Number(r.Present) === 1 && !Number(r.Absent) ? 'P' : Number(r.Absent) === 1 && !Number(r.Present) ? 'A' : 'other';
    if (was === st) continue;
    students[s.ID] = st === 'A' ? { Present: 0, Absent: 1 } : { Present: 1, Absent: 0 };
  }
  return students;
}

window.onbeforeunload = e => { if (Object.keys(changes()).length) e.preventDefault(); };

async function submit() {
  const students = changes();
  if (!Object.keys(students).length) return;
  const btn = document.getElementById('submit');
  btn.disabled = true;
  msg('Submitting...');
  try {
    const res = await api(`Class/${val('cls')}/Attendance`, { Date: val('date'), Students: students });
    if (!res || Number(res.Success) !== 1) throw new Error(JSON.stringify(res));
    await load();
    msg(`Saved: ${res.Created || 0} new, ${res.Updated || 0} updated.`, 'ok');
  } catch (e) {
    btn.disabled = false;
    msg('Not saved: ' + e.message, 'err');
  }
}

start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
