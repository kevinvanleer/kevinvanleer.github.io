<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://app.sycamoreschool.com https://o4512329506422784.ingest.us.sentry.io; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Attendance</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
          --accent: #1f3a5f; --absent: #b42318; --absent-bg: #fef3f2; --ok: #067647;
          --warn: #f5b40b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --ink: #e8eaed; --muted: #9aa3ad; --line: #2a313a;
            --accent: #8fb3e0; --absent: #f97066; --absent-bg: #2a1614; --ok: #47cd89;
            --warn: #fdb022; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; gap: 8px; align-items: center; z-index: 1; }
  .dates { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .dates button { width: 32px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--ink);
                  font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
  .dates button:disabled { opacity: .3; cursor: default; }
  header.past .datebtn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, var(--bg)); font-weight: 600; }
  .today { flex: none; padding: 6px 10px; border: 1px solid var(--warn); border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .today[hidden] { display: none; }
  .datebtn, main select { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
           border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; }
  .datebtn { position: relative; flex: 1; background: var(--bg); text-align: center; font-weight: 600; cursor: pointer; }
  .dates { position: relative; }
  .dates .datebtn { width: auto; height: 36px; font-size: 16px; line-height: 1; }
  #date { position: absolute; left: 50%; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  main select { display: block; width: 100%; padding: 10px 12px; font-weight: 600; }
  .avatar { position: relative; flex: none; }
  .avatar > button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent);
                     color: var(--bg); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .menu { position: absolute; right: 0; top: 44px; min-width: 180px; padding: 8px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgb(0 0 0 / .15); }
  .menu[hidden] { display: none; }
  .menu p { margin: 4px 8px 8px; color: var(--muted); font-size: 14px; }
  .menu button { width: 100%; text-align: left; padding: 8px; border: 0; border-radius: 6px;
                 background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .menu button:hover { background: var(--bg); }
  .menu { width: 240px; }
  .menu .note { margin: 4px 8px; font-size: 13px; }
  .menu .seg { display: flex; gap: 4px; margin: 4px 8px 8px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; }
  .menu .seg button { flex: 1; text-align: center; padding: 6px; }
  .menu .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  main { padding: 12px 16px 150px; max-width: 640px; margin: 0 auto; }
  .controls { margin: -12px -16px 16px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .controls select { background: var(--bg); }
  .summary { color: var(--muted); margin: 0 auto 8px; max-width: 640px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-align: center; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; display: flex; justify-content: space-between; align-items: center;
              padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px;
              background: var(--card); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  li button .state { font-size: 14px; color: var(--muted); }
  li button.absent { background: var(--absent-bg); border-color: var(--absent); }
  li button.absent .state { color: var(--absent); font-weight: 600; }
  li button.other .state { font-style: italic; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: var(--card);
           border-top: 1px solid var(--line); }
  footer button, .setup button { width: 100%; max-width: 640px; display: block; margin: 0 auto; padding: 14px;
           font: inherit; font-weight: 600; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); }
  footer button:disabled { opacity: .5; }
  li button.unsaved { border-left: 5px solid var(--warn); padding-left: 12px; }
  .unsaved-count { color: var(--warn); font-weight: 600; }
  .msg { text-align: center; margin: 8px 0 0; font-size: 15px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--absent); }
  .setup { padding: 32px 20px 48px; max-width: 480px; margin: 0 auto; line-height: 1.5; }
  .setup .logo { display: block; width: 100%; height: auto; padding: 12px; background: #fff; border-radius: 12px; }
  .setup a { color: var(--accent); font-weight: 600; }
  .setup input { width: 100%; font: inherit; padding: 12px; margin: 12px 0; border: 1px solid var(--line);
                 border-radius: 8px; background: var(--card); color: var(--ink); }
  .warn { padding: 14px 16px; border: 1px solid var(--absent); border-radius: 10px; background: var(--absent-bg); font-size: 15px; margin-top: 24px; }
  .setup h2 { margin: 28px 0 24px; }
  .setup label { display: block; font-weight: 600; }
  .setup input { margin: 10px 0 14px; }
  .setup .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 16px 0 0; }
  .setup .hint.install { margin: 0 0 24px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
  .setup h3 { margin: 0 0 12px; font-size: 17px; }
  .setup .signin { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
  .setup ol { margin: 0; padding-left: 22px; }
  .setup li { margin: 10px 0; }
  .setup button.secondary { margin-top: 12px; background: none; color: var(--ink); border: 1px solid var(--line); }
  .setup:has(+ footer) { padding-bottom: 200px; }
  .setup:has(+ footer) #forget { margin-top: 32px; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
